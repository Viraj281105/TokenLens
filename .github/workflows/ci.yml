name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install fastapi uvicorn pydantic httpx pytest pytest-asyncio pytest-cov
          pip install tiktoken scikit-learn numpy aiofiles slowapi python-multipart
          pip install faiss-cpu sentence-transformers torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        env:
          GEMINI_API_KEY: test123
          TOKEN_LENS_API_KEY: test123
        run: |
          pytest backend/tests/ --cov=backend --cov-report=term-missing -v --tb=short
        continue-on-error: true
